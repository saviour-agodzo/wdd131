<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book of Mormon Favorites</title>
    <link rel="stylesheet" href="styles/bom.css">
    <script src="scripts/bom.js" defer></script>
</head>

<body> 
    <h1> 📖 Book of Mormon - Top 10</h1>
    <main>
        <label for="favchap">Enter Book and Chapter</label>
        <input type="text" id="favchap" placeholder="Alma 5" aria-describedby="message">
        <button type="button" id="addChapter">Add Chapter</button>

        <p id="message" role="status" aria-live="polite"></p>

        <ul id="list"></ul>
    </main>
</body>

</html>
