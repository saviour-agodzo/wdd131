<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive album featuring temples around the world.">
    <title>Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <div class="header-content">
            <a class="site-title" href="temples.html">Temple Album</a>

            <button class="menu-button" type="button" aria-label="Open navigation menu" aria-expanded="false">☰</button>

            <nav aria-label="Primary navigation">
                <a href="#home">Home</a>
                <a href="#old">Old</a>
                <a href="#new">New</a>
                <a href="#large">Large</a>
                <a href="#small">Small</a>
            </nav>
        </div>
    </header>

    <main id="home">
        <h1>Home</h1>

        <section class="album" aria-label="Temple photograph album">
            <figure id="old">
                <img src="https://images.unsplash.com/photo-1548625361-58a9b86aa83b?auto=format&fit=crop&w=700&q=80"
                    alt="Historic stone temple reflected in water" width="700" height="467" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1508009603885-50cf7c579365?auto=format&fit=crop&w=700&q=80"
                    alt="Ornate temple roof at sunset" width="700" height="467" loading="lazy">
                <figcaption>Bangkok Thailand Temple</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=700&q=80"
                    alt="White marble temple with a reflecting pool" width="700" height="467" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure id="new">
                <img src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=700&q=80"
                    alt="Temple façade in warm evening light" width="700" height="467" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1532664189809-02133fee698d?auto=format&fit=crop&w=700&q=80"
                    alt="Golden temple surrounded by trees" width="700" height="467" loading="lazy">
                <figcaption>Manila Philippines Temple</figcaption>
            </figure>

            <figure id="large">
                <img src="https://images.unsplash.com/photo-1528360983277-13d401cdc186?auto=format&fit=crop&w=700&q=80"
                    alt="Large temple with ornate domes" width="700" height="467" loading="lazy">
                <figcaption>Mexico City Temple</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1561361513-2d000a50f0dc?auto=format&fit=crop&w=700&q=80"
                    alt="Temple silhouette in a mountain landscape" width="700" height="467" loading="lazy">
                <figcaption>Provo City Center Temple</figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=700&q=80"
                    alt="Modern white building beneath a blue sky" width="700" height="467" loading="lazy">
                <figcaption>Kyiv Ukraine Temple</figcaption>
            </figure>

            <figure id="small">
                <img src="https://images.unsplash.com/photo-1514222134-b57cbb8ce073?auto=format&fit=crop&w=700&q=80"
                    alt="Small temple building in a peaceful garden" width="700" height="467" loading="lazy">
                <figcaption>Freiberg Germany Temple</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>© <span id="currentyear"></span> 🌴 Saviour Agodzo 🌴 Ghana</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
