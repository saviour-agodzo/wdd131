<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product review form for submitting a product review.">
    <meta name="author" content="Saviour Agodzo">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">
                Product Name
            </label>

            <select id="product" name="product" required>
                <option value="" disabled selected>
                    Choose a Product ...
                </option>
            </select>


            <fieldset class="rating-fieldset">
                <legend>Overall Rating</legend>

                <div class="rating">

                    <label for="rating1">
                        <span>☆</span>
                        <input type="radio" id="rating1" name="rating" value="1" required>
                    </label>

                    <label for="rating2">
                        <span>☆☆</span>
                        <input type="radio" id="rating2" name="rating" value="2" required>
                    </label>

                    <label for="rating3">
                        <span>☆☆☆</span>
                        <input type="radio" id="rating3" name="rating" value="3" required>
                    </label>

                    <label for="rating4">
                        <span>☆☆☆☆</span>
                        <input type="radio" id="rating4" name="rating" value="4" required>
                    </label>

                    <label for="rating5">
                        <span>☆☆☆☆☆</span>
                        <input type="radio" id="rating5" name="rating" value="5" required>
                    </label>

                </div>
            </fieldset>


            <label for="installDate">
                Date of Installation
            </label>

            <input type="date" id="installDate" name="installDate" required>


            <fieldset class="features">
                <legend>
                    Which features did you find useful in the product?
                    <em>(Check all that apply)</em>
                </legend>

                <label for="feature1">
                    <input type="checkbox" id="feature1" name="features" value="Durability">
                    Durability
                </label>

                <label for="feature2">
                    <input type="checkbox" id="feature2" name="features" value="Ease of Use">
                    Ease of Use
                </label>

                <label for="feature3">
                    <input type="checkbox" id="feature3" name="features" value="Performance">
                    Performance
                </label>

                <label for="feature4">
                    <input type="checkbox" id="feature4" name="features" value="Design">
                    Design
                </label>
            </fieldset>


            <label for="writtenReview">
                Written Review <span class="optional">(Optional)</span>
            </label>

            <textarea id="writtenReview" name="writtenReview"></textarea>


            <label for="userName">
                Your Name <span class="optional">(Optional)</span>
            </label>

            <input type="text" id="userName" name="userName">


            <input type="submit" value="Post Review">

        </form>
    </main>


    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            🌴 Saviour Agodzo 🌴
            Ghana
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
